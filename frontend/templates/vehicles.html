<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Management</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/vehicles">Vehicles</a>
        <a href="/mileage">Mileage</a>
        <a href="/maintenance">Maintenance</a>
    </nav>

    <h1>Vehicle Management</h1>

    <div class="form-card">
        <h2>Add Vehicle</h2>
        <form onsubmit="event.preventDefault(); saveVehicle();">
            <input type="hidden" id="vehicle_id">
            <div class="form-row">
                <input type="text" id="make" placeholder="Make (e.g. Toyota)" required>
                <input type="text" id="model" placeholder="Model (e.g. Camry)" required>
            </div>
            <div class="form-row">
                <input type="number" id="year" placeholder="Year (e.g. 2020)">
                <input type="text" id="vin" placeholder="VIN (optional)">
            </div>
            <div class="btn-group">
                <button type="submit">Add Vehicle</button>
            </div>
        </form>
    </div>

    <table id="vehicleTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Make</th>
                <th>Model</th>
                <th>Year</th>
                <th>VIN</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for v in initial_vehicles %}
            <tr>
                <td>{{ v.id }}</td>
                <td>{{ v.make }}</td>
                <td>{{ v.model }}</td>
                <td>{{ v.year or '-' }}</td>
                <td>{{ v.vin or '-' }}</td>
                <td>
                    <button class="edit" onclick="editVehicle({{ v.id }}, '{{ v.make|replace("'", "\\'") }}', '{{ v.model|replace("'", "\\'") }}', '{{ (v.year or "")|string }}', '{{ v.vin or "" }}')">Edit</button>
                    <button class="delete" onclick="deleteVehicle({{ v.id }})">Delete</button>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="6" style="text-align:center; opacity:0.6;">No vehicles found. Add one above.</td></tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        window.INITIAL_VEHICLES = {{ initial_vehicles|tojson|safe }};
    </script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/state.js"></script>
    <script src="/static/js/vehicles.js"></script>
    <script src="/static/js/mileage.js"></script>
    <script src="/static/js/maintenance.js"></script>
    <script src="/static/js/home.js"></script>
</body>
</html>
