<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Management</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/vehicles">Vehicles</a>
        <a href="/mileage">Mileage</a>
        <a href="/maintenance">Maintenance</a>
    </nav>

    <h1>Vehicle Management</h1>

    <div class="form-container">
        <div class="form">
            <input type="hidden" id="vehicle_id">
            <input id="make" placeholder="Make" required>
            <input id="model" placeholder="Model" required>
            <input id="year" type="number" placeholder="Year">
            <input id="vin" placeholder="VIN">
            
            <button class="save" onclick="saveVehicle()">Save Vehicle</button>
            <button class="cancel" onclick="clearVehicleForm()">Clear Form</button>
        </div>
    </div>

    <div class="table-wrap">
    <table id="vehicleTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Make</th>
                <th>Model</th>
                <th>Year</th>
                <th>VIN</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </div>

    <script src="/static/js/state.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/vehicles.js"></script>
    <script src="/static/js/mileage.js"></script>
    <script src="/static/js/maintenance.js"></script>
    <script src="/static/js/home.js"></script>
</body>
</html>
