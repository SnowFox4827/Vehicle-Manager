<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Tracking</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/vehicles">Vehicles</a>
        <a href="/mileage">Mileage</a>
        <a href="/maintenance">Maintenance</a>
    </nav>

    <h1>Maintenance Tracking</h1>

    <div class="form-container">
        <div class="form">
            <select id="vehicle" required></select>
            
            <input 
                id="service_date" 
                type="date" 
                required>
            
            <!-- Service Category -->

            <select id="service_category" onchange="loadServices()">

                <option value="">
                    -- Select Category --
                </option>

            </select>


            <select id="service_type">

                <option value="">
                    -- Select Service --
                </option>

            </select>
            
            <input 
                id="description" 
                placeholder="Additional notes">
            
            <input 
                id="maintenance_mileage" 
                type="number" 
                placeholder="Mileage at Service">
            
            <button class="save" onclick="saveMaintenance()">Add Maintenance Record</button>
        </div>
    </div>

    <div class="table-wrap">
    <table id="maintenanceTable">
        <thead>
            <tr>
                <th>Vehicle</th>
                <th>Date</th>
                <th>Category</th>
                <th>Service</th>
                <th>Description</th>
                <th>Mileage</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </div>

    <script src="/static/js/state.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/vehicles.js"></script>
    <script src="/static/js/mileage.js"></script>
    <script src="/static/js/maintenance.js"></script>
    <script src="/static/js/home.js"></script>
</body>
</html>
