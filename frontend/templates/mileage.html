<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mileage Log</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/vehicles">Vehicles</a>
        <a href="/mileage">Mileage</a>
        <a href="/maintenance">Maintenance</a>
    </nav>

    <h1>Mileage Log</h1>

    <div class="form-card">
        <h2>Log Mileage</h2>
        <form onsubmit="event.preventDefault(); saveMileage();">
            <div class="form-row">
                <select id="vehicle" required>
                    <option value="">-- Select Vehicle --</option>
                    {% for v in initial_vehicles %}
                    <option value="{{ v.id }}">{{ (v.year ~ ' ' if v.year else '') ~ v.make ~ ' ' ~ v.model }}</option>
                    {% endfor %}
                </select>
                <input type="number" id="mileage" placeholder="Mileage (miles)" required>
                <input type="date" id="date" required>
            </div>
            <div class="btn-group">
                <button type="submit">Log Mileage</button>
            </div>
        </form>
    </div>

    <div class="filter-bar">
        <label for="filterVehicle">Filter by Vehicle: </label>
        <select id="filterVehicle" onchange="applyMileageFilter()">
            <option value="">-- All Vehicles --</option>
            {% for v in initial_vehicles %}
            <option value="{{ v.id }}">{{ (v.year ~ ' ' if v.year else '') ~ v.make ~ ' ' ~ v.model }}</option>
            {% endfor %}
        </select>
    </div>

    <table id="mileageTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Vehicle</th>
                <th>Mileage</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for m in initial_mileage %}
            <tr>
                <td>{{ m.id }}</td>
                <td>{{ (m.year ~ ' ' if m.year else '') ~ m.make ~ ' ' ~ m.model }}</td>
                <td>{{ "{:,}".format(m.mileage) }} mi</td>
                <td>{{ m.date }}</td>
                <td>
                    <button class="edit" onclick="editMileage({{ m.id }}, {{ m.vehicle_id }}, {{ m.mileage }}, '{{ m.date }}')">Edit</button>
                    <button class="delete" onclick="deleteMileage({{ m.id }})">Delete</button>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="5" style="text-align:center; opacity:0.6;">No mileage records found.</td></tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        window.INITIAL_VEHICLES = {{ initial_vehicles|tojson|safe }};
        window.INITIAL_MILEAGE = {{ initial_mileage|tojson|safe }};
    </script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/state.js"></script>
    <script src="/static/js/vehicles.js"></script>
    <script src="/static/js/mileage.js"></script>
    <script src="/static/js/maintenance.js"></script>
    <script src="/static/js/home.js"></script>
</body>
</html>
