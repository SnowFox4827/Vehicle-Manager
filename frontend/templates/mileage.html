<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mileage Tracking</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/vehicles">Vehicles</a>
        <a href="/mileage">Mileage</a>
        <a href="/maintenance">Maintenance</a>
    </nav>

    <h1>Mileage Tracking</h1>

    <div class="form-container">
        <div class="form">
            <select id="vehicle"></select>
            <input id="mileage" type="number" placeholder="Current Mileage" required>
            <input id="date" type="date" required>
            <button class="save" onclick="saveMileage()">Add Mileage</button>
        </div>
    </div>

    <div class="form-container">
        <div class="form">
            <label for="filterVehicle" style="align-self:center;">Filter by Vehicle:</label>
            <select id="filterVehicle" onchange="applyMileageFilter()"></select>
        </div>
    </div>

    <div class="table-wrap">
    <table id="mileageTable">
        <thead>
            <tr>
                <th>Vehicle</th>
                <th>Mileage</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </div>

    <script src="/static/js/state.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/vehicles.js"></script>
    <script src="/static/js/mileage.js"></script>
    <script src="/static/js/maintenance.js"></script>
    <script src="/static/js/home.js"></script>
</body>
</html>
