services:

  backend:
    build: ./backend
    container_name: vehicle_backend

    ports:
      - "5003:5002"

    volumes:
      - ./backend:/app

    environment:
      - FLASK_ENV=development

    restart: unless-stopped


  frontend:
    build: ./frontend
    container_name: vehicle_frontend

    ports:
      - "5002:5000"

    volumes:
      - ./frontend:/app

    depends_on:
      - backend

    restart: unless-stopped