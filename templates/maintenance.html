<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Tracking</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/vehicles">Vehicles</a>
        <a href="/mileage">Mileage</a>
        <a href="/maintenance">Maintenance</a>
    </nav>

    <h1>Maintenance Tracking</h1>

    <div class="form-container">
        <div class="form">
            <select id="vehicle"></select>
            <input id="service_date" type="date" required>
            <input id="service_type" placeholder="Service Type" required>
            <input id="description" placeholder="Description">
            <input id="maintenance_mileage" type="number" placeholder="Mileage at Service">
            <button class="save" onclick="saveMaintenance()">Add Maintenance</button>
        </div>
    </div>

    <table id="maintenanceTable">
        <thead>
            <tr>
                <th>Vehicle</th>
                <th>Date</th>
                <th>Service</th>
                <th>Description</th>
                <th>Mileage</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="/static/app.js"></script>
</body>
</html>
